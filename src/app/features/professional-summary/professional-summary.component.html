<section [id]="content().id" [attr.aria-labelledby]="content().id + '-title'">
  <app-container>
    <div class="summary-grid">
      <div>
        <app-section-heading
          [headingId]="content().id + '-title'"
          [eyebrow]="content().eyebrow"
          [title]="content().title"
        />
        <p class="summary-body">{{ content().body }}</p>
      </div>

      <ol class="summary-points">
        @for (point of content().points; track point.title; let index = $index) {
          <li>
            <span aria-hidden="true">0{{ index + 1 }}</span>
            <div>
              <h3>{{ point.title }}</h3>
              <p>{{ point.description }}</p>
            </div>
          </li>
        }
      </ol>
    </div>
  </app-container>
</section>
