<header>
  <app-container>
    <div class="header-row">
      <a class="wordmark" href="#inicio" [attr.aria-label]="messages().homeLabel">{{ name() }}</a>

      <nav class="desktop-navigation" [attr.aria-label]="messages().primaryNavigationLabel">
        <ul>
          @for (item of navigation(); track item.href) {
            <li><a [href]="item.href">{{ item.label }}</a></li>
          }
        </ul>
      </nav>

      <div class="desktop-actions">
        <select
          class="language-select"
          [attr.aria-label]="messages().language.selectorLabel"
          [attr.aria-busy]="language.switching()"
          [disabled]="language.switching()"
          [value]="language.activeLanguage()"
          (change)="changeLanguage($event)"
        >
          <option value="pt-BR">{{ messages().language.ptBR }}</option>
          <option value="en">{{ messages().language.en }}</option>
        </select>
        <button type="button" class="contact-link" (click)="contactModal.show()">
          {{ contactLink().label }}
        </button>
        <a
          class="resume-link"
          [href]="resume().href"
          [attr.download]="resume().filename"
          [attr.aria-label]="messages().resume.downloadAria"
        >
          {{ messages().resume.download }}
        </a>
      </div>

      <button
        #menuToggle
        class="menu-toggle"
        type="button"
        [attr.aria-label]="messages().openMenu"
        aria-controls="mobile-navigation"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>
    </div>
  </app-container>

  <dialog
    #menuDialog
    id="mobile-navigation"
    aria-labelledby="mobile-navigation-title"
    (cancel)="handleCancel($event)"
    (close)="menuOpen.set(false)"
  >
    <button
      class="dialog-backdrop"
      type="button"
      [attr.aria-label]="messages().closeMenu"
      (click)="closeMenu(true)"
    ></button>
    <div class="mobile-panel">
      <div class="mobile-heading">
        <p id="mobile-navigation-title">{{ messages().mobileMenuTitle }}</p>
        <button type="button" [attr.aria-label]="messages().closeMenu" (click)="closeMenu(true)">×</button>
      </div>
      <nav [attr.aria-label]="messages().mobileNavigationLabel">
        <ul>
          @for (item of navigation(); track item.href) {
            <li><a [href]="item.href" (click)="closeMenu(true)">{{ item.label }}</a></li>
          }
        </ul>
      </nav>
      <div class="mobile-tools">
        <select
          class="language-select"
          [attr.aria-label]="messages().language.selectorLabel"
          [attr.aria-busy]="language.switching()"
          [disabled]="language.switching()"
          [value]="language.activeLanguage()"
          (change)="changeLanguage($event)"
        >
          <option value="pt-BR">{{ messages().language.ptBR }}</option>
          <option value="en">{{ messages().language.en }}</option>
        </select>
        <a
          class="mobile-resume"
          [href]="resume().href"
          [attr.download]="resume().filename"
          [attr.aria-label]="messages().resume.downloadAria"
          (click)="closeMenu(false)"
        >
          {{ messages().resume.download }}
        </a>
      </div>
      <button
        type="button"
        class="mobile-contact"
        (click)="closeMenu(true); contactModal.show()"
      >
        {{ contactLink().label }}
      </button>
    </div>
  </dialog>
</header>
